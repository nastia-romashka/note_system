- name: Deploy one service from docker compose
  hosts: all
  become: true
  vars:
    compose_project_dir: /opt/notes_system
    service_name: ""
  tasks:
    - name: Pull selected image
      ansible.builtin.command:
        cmd: docker compose pull {{ service_name }}
        chdir: "{{ compose_project_dir }}"

    - name: Recreate selected service
      ansible.builtin.command:
        cmd: docker compose up -d {{ service_name }}
        chdir: "{{ compose_project_dir }}"
